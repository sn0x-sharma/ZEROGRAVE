<!doctype html><html><head><title>Login Test Site</title></head>
<body>
<h1>Login Test Site</h1>
<form action="/login" method="POST" autocomplete="on">
  <label>Username <input type="text" id="u" name="username" autocomplete="username"></label><br>
  <label>Password <input type="password" id="p" name="password" autocomplete="current-password"></label><br>
  <button type="submit" id="submitbtn">Sign in</button>
</form>
</body></html>
